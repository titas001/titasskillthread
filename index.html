  bn:{t:'প্রতিটি সংখ্যা তার হিসাব দেখায়',w:'ডটেড দাগের যেকোনো সংখ্যা এই প্যানেল খোলে: সহজ ভাষায় সূত্র, উৎসসহ প্রতিটি ইনপুট, হিসাব ও ফলাফল।',y:'কাউকে অন্ধভাবে বিশ্বাস করতে হয় না। পিএম, অডিটর বা বায়ার দুই ক্লিকে যেকোনো সংখ্যা যাচাই করতে পারেন।',s:'ব্যবস্থাপনা এ কারণেই নিশ্চিন্ত: প্রতিটি সংখ্যা যে কেউ এখানেই যাচাই করতে পারেন।'}}),
 S({ch:4,role:'plan',sel:'#aidrawer',show(){A.openBoard(demoOrderId());const q=UI.lang==='bn'?'লাইন B1 কেন ৫৫%, কীভাবে ঠিক করব?':'Why is line B1 at 55% and how do I fix it?';const p=getPlan(demoOrderId());const keep={...p.assign},bal=p.balanced;p.assign={...p.memory};const a=localAnswer(q);p.assign=keep;p.balanced=bal;AI.msgs=[{role:'user',content:q},{role:'assistant',content:a}];UI.drawer='ai';},
  en:{t:'SkillThread AI: a planning copilot',w:'Every role has an AI copilot. It opens with insights for that person, suggests questions, and answers using live SkillThread data — here it explains why B1 was at 55% and lists the exact swaps that fix it.',y:'Planners get a second opinion in seconds, in plain language. The AI suggests; a person always decides. It never uses age, gender or other personal details.',tr:'Close the panel and click “Ask AI” at the bottom right on any screen.',s:'Think of it as an experienced planner sitting next to you — it reads the same data and explains its reasoning.'},
  bn:{t:'SkillThread এআই: পরিকল্পনা সহকারী',w:'প্রতিটি ভূমিকার জন্য একটি এআই সহকারী আছে। এটি ওই ব্যক্তির জন্য অন্তর্দৃষ্টি দেখায়, প্রশ্নের প্রস্তাব দেয়, আর লাইভ ডেটা দিয়ে উত্তর দেয় — এখানে বলছে B1 কেন ৫৫% ছিল এবং কোন বদলগুলো তা ঠিক করে।',y:'প্ল্যানাররা সেকেন্ডে সহজ ভাষায় দ্বিতীয় মত পান। এআই প্রস্তাব দেয়; সিদ্ধান্ত মানুষ নেয়। বয়স, লিঙ্গ বা ব্যক্তিগত তথ্য কখনো ব্যবহার করে না।',tr:'প্যানেল বন্ধ করে যেকোনো স্ক্রিনে নিচে ডানে “এআই সহকারী” চাপুন।',s:'পাশে বসা একজন অভিজ্ঞ প্ল্যানারের মতো — একই ডেটা পড়ে, আর কেন বলছে তা ব্যাখ্যা করে।'}}),
 S({ch:4,role:'pm',sel:'#pmapproval',show(){const o=O(demoOrderId());if(o.status==='Ready for Planning'){const r=UI.role;UI.role='plan';A.submitPlan(o.id);UI.role=r;}A.openBoard(demoOrderId());},done(){const o=O(demoOrderId());if(o.status==='Pending PM approval')A.approvePlan(o.id);},
  en:{t:'Production Manager approves',w:'Planning has submitted the plan. The Production Manager sees the same board with the approval bar on top and can approve or return it with a note.',y:'Nothing reaches the floor without the person responsible for production agreeing to it.',tr:'Press Next to approve.',s:'Planning proposes, the PM decides — with the same numbers in front of both.'},
  bn:{t:'প্রোডাকশন ম্যানেজার অনুমোদন দেন',w:'প্ল্যানিং প্ল্যান জমা দিয়েছে। প্রোডাকশন ম্যানেজার একই বোর্ড দেখেন, ওপরে অনুমোদনের বার — অনুমোদন বা মন্তব্যসহ ফেরত।',y:'উৎপাদনের দায়িত্বে থাকা মানুষ রাজি না হলে কিছুই ফ্লোরে যায় না।',tr:'পরবর্তী চাপলে অনুমোদন হবে।',s:'প্ল্যানিং প্রস্তাব দেয়, পিএম সিদ্ধান্ত নেন — দুজনের সামনেই একই সংখ্যা।'}}),
 S({ch:5,role:'plan',sel:'#ixform',show(){go('interchange');},done(){if(!D.interchange.find(x=>x.demo))A.ixCreate();const x=D.interchange.find(y=>y.demo);if(x.status==='Pending releasing unit'){const r=UI.role;UI.role='pm';A.ix(x.id,'rel');UI.role=r;}},
  en:{t:'A gap appears mid-order',w:'Moushumi, one of the four Shoulder Join operators, has approved leave in December. Without her, Shoulder Join slows the line. Planning asks for Hasina — Grade A Shoulder Join — from unit JKL-6.',y:'The gain for this line and the loss for the other line are shown before anyone approves.',tr:'Press Next to send the request; JKL-6’s PM releases her.',s:'Real life happens — leave, absence. We can see the gap weeks ahead and borrow the right person, with the cost on both sides visible.'},
  bn:{t:'অর্ডারের মাঝে ঘাটতি',w:'চার শোল্ডার জয়েন অপারেটরের একজন মৌসুমী ডিসেম্বরে অনুমোদিত ছুটিতে। তাকে ছাড়া শোল্ডার জয়েন লাইন ধীর করে। প্ল্যানিং JKL-6 থেকে গ্রেড এ হাসিনাকে চায়।',y:'অনুমোদনের আগেই এই লাইনের লাভ ও অন্য লাইনের ক্ষতি দেখা যায়।',tr:'পরবর্তী চাপলে অনুরোধ যাবে; JKL-6-এর পিএম ছেড়ে দেবেন।',s:'ছুটি, অনুপস্থিতি হবেই। কয়েক সপ্তাহ আগেই ঘাটতি দেখে সঠিক মানুষ ধার নেওয়া যায়, দুই পক্ষের খরচ দেখে।'}}),
 S({ch:5,role:'agm',sel:'#ixdemo',show(){UI.phone=true;go('interchange');},done(){const x=D.interchange.find(y=>y.demo);if(x&&x.status==='Pending AGM/DGM')A.ix(x.id,'agm');UI.phone=false;},
  en:{t:'AGM approves on a phone',w:'The AGM gets the request on mobile, sees the gain (+pcs/hr for B1) and the loss for JKL-6, and approves with one tap.',y:'Decisions that used to wait for a meeting are made in minutes, and every approval is logged.',tr:'Press Next to approve.',s:'The AGM can approve from the floor or from home — and it’s recorded who approved what, and when.'},
  bn:{t:'এজিএম ফোনে অনুমোদন দেন',w:'এজিএম মোবাইলে অনুরোধ পান, B1-এর লাভ ও JKL-6-এর ক্ষতি দেখে এক ট্যাপে অনুমোদন দেন।',y:'যে সিদ্ধান্ত আগে মিটিংয়ের অপেক্ষায় থাকত, তা মিনিটে হয়, আর প্রতিটি অনুমোদন লগে থাকে।',tr:'পরবর্তী চাপলে অনুমোদন হবে।',s:'এজিএম ফ্লোর থেকে বা বাসা থেকেও অনুমোদন দিতে পারেন — কে কখন কী অনুমোদন দিলেন তা রেকর্ড থাকে।'}}),
 S({ch:5,role:'lc',sel:'#entrygrid',show(){go('entry');if(!Object.keys(UI.ent).length&&!D.flags.ent)A.entFill();},done(){if(!D.flags.ent){if(!Object.keys(UI.ent).length)A.entFill();A.entSubmit();D.flags.ent=true;}},
  en:{t:'Line Chief enters hourly output',w:'A tablet screen: one row per operator, one box per hour, a big keypad. Salma’s hour 2 says 60 pieces — that would be 150% efficiency, so the box turns red.',y:'This hourly data is what keeps every skill grade up to date — no extra paperwork.',tr:'Press Next to submit; the red value goes to IE to check.',s:'The Line Chief already counts hourly output. Now it takes a minute on a tablet, and it feeds everyone’s skill record.'},
  bn:{t:'লাইন চিফ ঘণ্টার উৎপাদন দেন',w:'ট্যাবলেট স্ক্রিন: প্রতি অপারেটরে একটি সারি, প্রতি ঘণ্টায় একটি ঘর, বড় কিপ্যাড। সালমার ২য় ঘণ্টায় ৬০ পিস — মানে ১৫০%, তাই ঘরটি লাল।',y:'এই ঘণ্টার ডেটাই প্রতিটি গ্রেড হালনাগাদ রাখে — বাড়তি কাগজ নেই।',tr:'পরবর্তী চাপলে জমা হবে; লাল মানটি আইই যাচাই করবেন।',s:'লাইন চিফ এখনই ঘণ্টার হিসাব রাখেন। এখন ট্যাবলেটে এক মিনিট, আর তা সবার দক্ষতার রেকর্ডে যায়।'}}),
 S({ch:5,role:'ie',sel:'#vqhero',show(){UI.tab.vt='queue';go('validate');},done(){const v=D.vq.find(x=>x.hero&&x.status==='Pending');if(v){v.note=`Corrected ${v.pcs} → 31 pcs`;v.pcs=31;v.eff=Math.round(31*v.smv/60*100);A.vq(v.id,'ok');}},
  en:{t:'IE checks the odd number',w:'Salma’s 60 pieces waits in the validation queue. It was a typing slip — the IE corrects it to 31.',y:'Only checked data changes anyone’s grade, so one wrong entry can never promote or demote a worker.',tr:'Press Next to correct and confirm.',s:'One typo can’t change Salma’s grade. Outliers wait for an IE to check them.'},
  bn:{t:'আইই অস্বাভাবিক সংখ্যা যাচাই করেন',w:'সালমার ৬০ পিস যাচাই সারিতে অপেক্ষায়। এটা টাইপের ভুল — আইই ৩১ করেন।',y:'শুধু যাচাইকৃত ডেটাই গ্রেড বদলায়, তাই একটি ভুল এন্ট্রি কাউকে ওপরে বা নিচে নিতে পারে না।',tr:'পরবর্তী চাপলে সংশোধন ও নিশ্চিত হবে।',s:'একটি টাইপের ভুল সালমার গ্রেড বদলাতে পারে না। অস্বাভাবিক সংখ্যা আইই যাচাই পর্যন্ত অপেক্ষা করে।'}}),
 S({ch:5,role:'qa',sel:'#qcform',show(){UI.tab.qcl=DEMO_LINE_ID;go('quality');},done(){if(!D.flags.qc){A.qcAddData(DEMO_LINE_ID,'705611',120,1,'In-line');D.flags.qc=true;}},
  en:{t:'QA records a quality check',w:'QA picks the line and operator, enters pieces checked and defects. DHU — defects per hundred units — is worked out instantly.',y:'Quality is part of every skill grade and match score, so fast-but-careless work does not win.',tr:'Press Next to save a check: 120 checked, 1 defect.',s:'Speed isn’t everything. QA’s checks feed straight into who gets picked for the next order.'},
  bn:{t:'কিউএ মান যাচাই রেকর্ড করেন',w:'কিউএ লাইন ও অপারেটর বাছেন, যাচাই করা পিস ও ত্রুটি লেখেন। DHU — প্রতি ১০০ পিসে ত্রুটি — সঙ্গে সঙ্গে হিসাব হয়।',y:'মান প্রতিটি গ্রেড ও ম্যাচ স্কোরের অংশ, তাই দ্রুত কিন্তু অযত্নের কাজ জেতে না।',tr:'পরবর্তী চাপলে চেক সংরক্ষণ হবে: ১২০ পিস, ১টি ত্রুটি।',s:'শুধু গতিই সব নয়। কিউএ-র চেক সরাসরি ঠিক করে পরের অর্ডারে কে বাছাই হবে।'}}),
 S({ch:6,role:'tr',sel:'#gapheat',show(){UI.tab.sop='SH';go('skills');},done(){['733400','733401','733402'].forEach(id=>{if(W(id))A.train(id,'SH',3,true);});},
  en:{t:'Training: see gaps before they hurt',w:'The next 8 weeks of booked orders compared with skilled workers available. Shoulder Join is short every week. Below, near-ready workers — Grade C and improving — are suggested.',y:'Training is aimed at the skills the coming orders need, weeks in advance.',tr:'Press Next to assign three near-ready workers to Shoulder Join training.',s:'We don’t wait for the bottleneck to appear on the floor. We see it eight weeks ahead and train for it.'},
  bn:{t:'ট্রেনিং: ক্ষতির আগেই ঘাটতি দেখা',w:'আগামী ৮ সপ্তাহের অর্ডার বনাম দক্ষ কর্মী। শোল্ডার জয়েনে প্রতি সপ্তাহে ঘাটতি। নিচে প্রায়-প্রস্তুত কর্মী — গ্রেড সি ও উন্নতিশীল — প্রস্তাবিত।',y:'আসন্ন অর্ডারে যে দক্ষতা লাগবে, সপ্তাহ আগেই সেই প্রশিক্ষণ।',tr:'পরবর্তী চাপলে তিনজনকে শোল্ডার জয়েন প্রশিক্ষণে দেওয়া হবে।',s:'ফ্লোরে বটলনেক দেখা দেওয়ার অপেক্ষা নয়। আট সপ্তাহ আগে দেখে প্রশিক্ষণ দিই।'}}),
 S({ch:6,role:'top',sel:'#kpis',show(){go('home');},
  en:{t:'Management: the whole factory on one screen',w:'Five headline numbers: factory efficiency, capacity gained per month, lines on target, approvals pending and orders at risk. Each one opens its calculation.',y:'Management sees results and risk without asking for a report.',tr:'Click “Capacity gained per month”.',s:'For management, it’s five numbers — and each one can be opened to see exactly how it was calculated.'},
  bn:{t:'ব্যবস্থাপনা: পুরো কারখানা এক স্ক্রিনে',w:'পাঁচটি মূল সংখ্যা: কারখানার দক্ষতা, মাসে বাড়তি সক্ষমতা, টার্গেটে থাকা লাইন, অপেক্ষমাণ অনুমোদন ও ঝুঁকির অর্ডার। প্রতিটি তার হিসাব খোলে।',y:'রিপোর্ট না চেয়েই ব্যবস্থাপনা ফলাফল ও ঝুঁকি দেখে।',tr:'“মাসে বাড়তি সক্ষমতা” চাপুন।',s:'ব্যবস্থাপনার জন্য পাঁচটি সংখ্যা — প্রতিটি খুলে হিসাব দেখা যায়।'}}),
 S({ch:6,role:'top',sel:'#decisions',show(){go('home');},
  en:{t:'Decisions waiting',w:'Every approval still open across the factory, with who has to decide it: plans, worker moves, SMV confirmations, data checks.',y:'Nothing gets stuck quietly in someone’s inbox.',s:'This list is how we make sure nothing gets stuck.'},
  bn:{t:'অপেক্ষমাণ সিদ্ধান্ত',w:'কারখানাজুড়ে যত অনুমোদন খোলা, কাকে সিদ্ধান্ত নিতে হবে সহ: প্ল্যান, কর্মী বদল, এসএমভি, ডেটা যাচাই।',y:'কিছুই চুপচাপ কারও ইনবক্সে আটকে থাকে না।',s:'এই তালিকাই নিশ্চিত করে যে কিছু আটকে নেই।'}}),
 S({ch:6,role:'top',sel:'#receipt',show(){go('home');},
  en:{t:'What 10 seconds is worth',w:'From the original study: save 10 seconds per minute on one line → 1.33 hours per day → 133 extra pieces → ৳33,815 per line per day at the study rate. Every input can be changed.',y:'Small time savings, multiplied across lines and days, become crores per year.',tr:'Change “Seconds saved” to 5 and watch the result.',s:'Ten seconds a minute sounds tiny. Across 36 lines, it’s more than three crore taka a month in capacity.'},
  bn:{t:'১০ সেকেন্ডের মূল্য',w:'মূল স্টাডি থেকে: এক লাইনে প্রতি মিনিটে ১০ সেকেন্ড সাশ্রয় → দিনে ১.৩৩ ঘণ্টা → ১৩৩ পিস বেশি → স্টাডি রেটে প্রতি লাইনে দিনে ৩৩,৮১৫ টাকা। প্রতিটি ইনপুট বদলানো যায়।',y:'ছোট সময় সাশ্রয়, লাইন ও দিনে গুণ হয়ে, বছরে কোটি টাকা হয়।',tr:'“Seconds saved” ৫ করে ফল দেখুন।',s:'মিনিটে ১০ সেকেন্ড খুব কম শোনায়। ৩৬ লাইনে তা মাসে তিন কোটি টাকার বেশি সক্ষমতা।'}}),
 S({ch:6,role:'rev',sel:'#reviewtable',show(){if(!D.signoffs.board){D.comments.push({view:'board',text:'Planning logic checked against the study sheet. Auto-Balance moves are clear.',user:RX.rev.user,role:RX.rev.en,ts:Date.now()});const r=UI.role;UI.role='rev';A.signoff('board','Planning');UI.role=r;}go('reviews');},
  en:{t:'Reviewers sign off',w:'Each department checks its own screens, leaves comments and signs off. Planning has just signed off the planning board. Every step in this demo is in the audit log.',y:'The system is checked by the people who will use it — and every action can be traced.',s:'Before go-live, each department signs off its own part. And every click you saw today is in the audit log.'},
  bn:{t:'রিভিউয়ার সাইন-অফ দেন',w:'প্রতিটি বিভাগ নিজের স্ক্রিন যাচাই করে, মন্তব্য দেয় ও সাইন-অফ দেয়। প্ল্যানিং এইমাত্র প্ল্যানিং বোর্ড সাইন-অফ দিয়েছে। এই ডেমোর প্রতিটি ধাপ অডিট লগে আছে।',y:'যারা ব্যবহার করবেন তারাই সিস্টেম যাচাই করেন — আর প্রতিটি কাজ খুঁজে পাওয়া যায়।',s:'চালুর আগে প্রতিটি বিভাগ নিজের অংশ সাইন-অফ দেয়। আর আজ যা যা দেখলেন সব অডিট লগে আছে।'}}),
 S({ch:6,role:'top',center:true,finish:true,show(){go('home');},
  en:{t:'What you just saw',w:'One order, nine roles, one system: skills recorded from real work → order entered once → SMV checked → the right people matched → line balanced from 55% to 71% → approved → measured every hour → gaps trained before they hurt.',y:'Right Person. Right Process. Right Line. — developed by BRAC IT.',s:'That’s SkillThread: the same people and machines, placed by proof instead of memory. Happy to take questions or open any screen again.'},
  bn:{t:'আপনি যা দেখলেন',w:'একটি অর্ডার, নয়টি ভূমিকা, একটি সিস্টেম: আসল কাজ থেকে দক্ষতা রেকর্ড → অর্ডার একবার → এসএমভি যাচাই → সঠিক মানুষ মেলানো → লাইন ৫৫% থেকে ৭১% → অনুমোদন → প্রতি ঘণ্টায় পরিমাপ → ক্ষতির আগেই প্রশিক্ষণ।',y:'সঠিক মানুষ। সঠিক প্রসেস। সঠিক লাইন। — ডেভেলপ করেছে ব্র্যাক আইটি।',s:'এটাই SkillThread: একই মানুষ ও মেশিন, স্মৃতি নয়, প্রমাণ দিয়ে বসানো। প্রশ্ন থাকলে বলুন, যেকোনো স্ক্রিন আবার খুলে দেখাতে পারি।'}})
];
const Tour={on:false,i:0,agenda:false,auto:null,
 start(i=0){A.reset();this.on=true;this.i=0;this.agenda=false;this.stopAuto();if(i>0){this.jump(i);return;}this.enter();},
 ensure(){for(let j=0;j<this.i;j++){if(!D.flags['done'+j]){if(STEPS[j].done){const r=UI.role;UI.role=STEPS[j].role;try{STEPS[j].done();}catch(e){console.warn('step',j,e);}UI.role=r;}D.flags['done'+j]=true;}}},
 enter(){const s=STEPS[this.i];this._scrolled=false;UI.drawer=null;UI.modal=null;UI.sel=null;this.ensure();UI.role=s.role;if(s.role!=='agm')UI.phone=false;s.show();render();this.place(true);},
 next(){const s=STEPS[this.i];if(s.done&&!D.flags['done'+this.i]){try{s.done();}catch(e){console.warn(e);}D.flags['done'+this.i]=true;}if(this.i>=STEPS.length-1){this.exit(true);return;}this.i++;this.enter();},
 back(){if(this.i>0){this.i--;this.enter();}},
 jump(i){this.agenda=false;this.i=i;this.enter();},
 toggleAuto(){if(this.auto)this.stopAuto();else{this.auto=setInterval(()=>{if(!this.on){this.stopAuto();return;}if(this.i>=STEPS.length-1)this.stopAuto();else this.next();},15000);}this.place();},
 stopAuto(){if(this.auto){clearInterval(this.auto);this.auto=null;}},
 exit(fin){this.on=false;this.stopAuto();UI.phone=false;['tspot','tpanel','tdim'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove();});if(fin){UI.role='top';go('home');toast(UI.lang==='bn'?'ডেমো শেষ — এখন নিজে ঘুরে দেখুন':'Demo complete — explore freely');}else render();},
 place(scroll){if(!this.on)return;const s=STEPS[this.i];const bn=UI.lang==='bn';const c=s[UI.lang]||s.en;
  let sp=document.getElementById('tspot'),pn=document.getElementById('tpanel'),dm=document.getElementById('tdim');
  if(!sp){sp=document.createElement('div');sp.id='tspot';sp.className='spot';document.body.appendChild(sp);}
  if(!dm){dm=document.createElement('div');dm.id='tdim';dm.className='tdim';document.body.appendChild(dm);}
  if(!pn){pn=document.createElement('div');pn.id='tpanel';pn.setAttribute('role','dialog');pn.setAttribute('aria-live','polite');document.body.appendChild(pn);}
  pn.className='tour'+(s.center?' center':'')+(UI.present?' present':'');
  const chSteps=CH.map((ch,k)=>STEPS.map((x,j)=>[x,j]).filter(([x])=>x.ch===k));
  const bar=`<div class="tbar">${chSteps.map((arr,k)=>`<div class="tseg" title="${(bn?CH[k].bn:CH[k].en)}">${arr.map(([x,j])=>`<i class="${j<this.i?'done':j===this.i?'cur':''}"></i>`).join('')}</div>`).join('')}</div>`;
  const agenda=this.agenda?`<div class="tagenda">${chSteps.map((arr,k)=>`<div class="tch">${k+1}. ${bn?CH[k].bn:CH[k].en}</div>${arr.map(([x,j])=>`<button class="${j===this.i?'on':''}" onclick="Tour.jump(${j})"><span class="mute">${j+1}</span> ${esc((x[UI.lang]||x.en).t)} <span class="small mute">· ${bn?RX[x.role].bn:RX[x.role].en}</span></button>`).join('')}`).join('')}</div>`:'';
  const centerExtra=s.center?(s.finish?`<div class="row" style="margin-top:14px"><button class="btn" onclick="Tour.start()">${ic('reset',16)} ${bn?'আবার শুরু':'Restart'}</button><button class="btn" onclick="Tour.exit();A.go('guide')">${bn?'কীভাবে কাজ করে':'How it works'}</button></div>`:`<div class="tchips">${CH.map((ch,k)=>`<span><b>${k+1}</b> ${bn?ch.bn:ch.en}</span>`).join('')}</div>`):'';
  pn.innerHTML=`<div class="row between" style="gap:8px"><div class="stp">${bn?'অধ্যায়':'Chapter'} ${s.ch+1} · ${bn?CH[s.ch].bn:CH[s.ch].en} · ${bn?RX[s.role].bn:RX[s.role].en}</div><div class="row" style="gap:4px;flex-wrap:nowrap"><span class="small mute nowrap">${this.i+1} / ${STEPS.length}</span><button class="ibtn tsm" title="Agenda" aria-label="Agenda" onclick="Tour.agenda=!Tour.agenda;Tour.place()">${ic('log',16)}</button><button class="ibtn tsm" aria-label="${t('Exit')}" title="${t('Exit')} (Esc)" onclick="Tour.exit()">${ic('x',16)}</button></div></div>
  ${bar}${agenda}
  <div class="tbody"><div><h3>${esc(c.t)}</h3>
  <p class="tw">${esc(c.w)}</p></div><div class="tnotes">
  <div class="ty">${ic('star',16)}<span><b>${bn?'কেন গুরুত্বপূর্ণ':'Why it matters'}:</b> ${esc(c.y)}</span></div>
  ${c.tr?`<div class="ttry">${ic('arrow',15)}<span><b>${bn?'চেষ্টা করুন':'Try it'}:</b> ${esc(c.tr)}</span></div>`:''}
  ${UI.present?`<div class="tsay"><b>${bn?'বলুন':'Say'}:</b> “${esc(c.s)}”</div>`:''}</div></div>
  ${centerExtra}
  <div class="row between" style="margin-top:14px"><span class="row" style="gap:6px"><button class="btn sm ${UI.present?'pri':''}" title="N" onclick="UI.present=!UI.present;Tour.place()">${bn?'বক্তার নোট':'Speaker notes'}</button><button class="btn sm ${this.auto?'pri':''}" title="A" onclick="Tour.toggleAuto()">${ic('play',14)} ${this.auto?(bn?'অটো চলছে':'Auto on'):(bn?'অটো-প্লে':'Auto-play')}</button></span>
  <span class="row" style="gap:6px"><button class="btn sm" ${this.i?'':'disabled'} onclick="Tour.back()">← ${t('Back')}</button><button class="btn acc" id="tournext" onclick="Tour.next()">${this.i===STEPS.length-1?t('Finish'):t('Next')} →</button></span></div>`;
  const el=s.center?null:document.querySelector(s.sel);
  dm.style.display=el?'none':'block';
  if(el&&innerWidth>=900){const r0=el.getBoundingClientRect();if(r0.width>=innerWidth*.55)pn.classList.add('wide');}
  const pos=()=>{const r=el?el.getBoundingClientRect():null;const vw=innerWidth,vh=innerHeight;
   if(r&&r.width){const pad=6;const top=Math.max(4,r.top-pad),h=Math.min(r.height+pad*2,vh-8-top);Object.assign(sp.style,{display:'block',left:(r.left-pad)+'px',top:top+'px',width:(r.width+pad*2)+'px',height:h+'px'});}else sp.style.display='none';
   const pw=pn.offsetWidth,ph=pn.offsetHeight;let L2,T2;
   if(s.center){L2=(vw-pw)/2;T2=Math.max(12,(vh-ph)/2);}
   else if(vw<700){L2=12;T2=vh-ph-12;}
   else if(r&&r.width){const right=r.right+16+pw<vw,left=r.left-16-pw>0;
    if(right&&r.width<vw*.55){L2=r.right+16;T2=Math.min(Math.max(80,r.top),vh-ph-12);}
    else if(left&&r.width<vw*.55){L2=r.left-16-pw;T2=Math.min(Math.max(80,r.top),vh-ph-12);}
    else{L2=Math.min(vw-pw-16,Math.max(16,r.left+(r.width-pw)/2));
     if(r.bottom+14+ph<=vh-8)T2=r.bottom+14;
     else if(r.top-14-ph>=72)T2=r.top-14-ph;
     else if(!Tour._scrolled&&r.height+ph+40<vh-72){Tour._scrolled=true;window.scrollBy(0,r.top-80);requestAnimationFrame(pos);return;}
     else{T2=Math.min(Math.max(r.bottom+14,72),vh-ph-12);}}}
   else{L2=vw-pw-16;T2=vh-ph-16;}
   pn.style.left=Math.max(8,L2)+'px';pn.style.top=Math.max(8,T2)+'px';};
  if(el&&scroll){const r=el.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-40)el.scrollIntoView({block:r.height>innerHeight*.6?'start':'center'});}
  pos();requestAnimationFrame(pos);setTimeout(pos,250);}
};
addEventListener('resize',()=>Tour.on&&Tour.place());
addEventListener('scroll',()=>{if(Tour.on){const s=STEPS[Tour.i];const el=!s.center&&document.querySelector(s.sel);const sp=document.getElementById('tspot');if(el&&sp){const r=el.getBoundingClientRect();Object.assign(sp.style,{left:(r.left-6)+'px',top:Math.max(4,r.top-6)+'px'});}}},{passive:true});
addEventListener('keydown',e=>{
 if(Tour.on){const tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();Tour.next();}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();Tour.back();}
  else if(e.key==='n'||e.key==='N'){UI.present=!UI.present;Tour.place();}
  else if(e.key==='a'||e.key==='A'){Tour.toggleAuto();}
  else if(e.key==='Escape'){Tour.exit();}
  return;}
 if(e.key==='Escape'&&(UI.drawer||UI.modal)){UI.drawer=null;UI.modal=null;render();}
});
render();


</script></body></html>
