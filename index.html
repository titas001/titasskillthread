<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillThread — BRAC IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/*
VOICE: calm, light, exact — a modern operations tool a line chief and a director can both read at a glance.
IDEA: the sewing line itself — stations in sequence joined by a thread; one red marker where the line slows.
PICTURE: the Planning Board as a horizontal line of stations with live capacity; summary strips lead every page.
COLOUR and TYPE: soft grey page, white surfaces, BRAC IT navy for action, coral only for brand moments, red only for problems; Plus Jakarta Sans + Inter + Hind Siliguri.
LAYOUT: white sidebar (brand, role, nav, demo, help), slim top bar (search, language, alerts), content up to 1360px.
*/
:root{color-scheme:light;
--bg:#f4f6f9;--surface:#ffffff;--surface-2:#f8fafc;--line:#e6e9ef;--line-2:#d5dae3;
--ink:#101828;--ink-2:#344054;--mute:#667085;--faint:#98a2b3;
--brand:#0b2d5b;--brand-600:#14427f;--brand-50:#eef3fa;--brand-100:#dbe5f3;
--coral:#f15e5b;--coral-50:#fff1f0;--navy:#082C59;
--ok:#067647;--ok-50:#ecfdf3;--ok-200:#abefc6;--warn:#b54708;--warn-50:#fffaeb;--warn-200:#fedf89;--bad:#b42318;--bad-50:#fef3f2;--bad-200:#fecdca;--info:#175cd3;--info-50:#eff8ff;
--r:14px;--r-sm:10px;--sh-1:0 1px 2px rgb(16 24 40/.05);--sh-2:0 12px 32px -8px rgb(16 24 40/.16),0 4px 8px -4px rgb(16 24 40/.06);
/* legacy aliases used by views */
--panel:var(--surface-2);--card:var(--surface);--pri:var(--brand);--pri2:var(--brand-50);--sup:var(--brand-600);--sup2:var(--brand-50);--acc:var(--coral);--acc2:var(--coral-50);--ok2:var(--ok-50);--warn2:var(--warn-50);--bad2:var(--bad-50);--shadow:var(--sh-1);--pri-ink:#fff}
:root,:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Inter','Hind Siliguri',system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
body.bn{font-family:'Hind Siliguri','Inter',system-ui,sans-serif;font-size:15.5px}
h1,h2,h3,.disp,.kpi .v,.ba .big{font-family:'Plus Jakarta Sans','Hind Siliguri','Inter',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-600);outline-offset:2px;border-radius:6px}
a{color:var(--brand-600)}
h1{font-size:clamp(22px,2.4vw,28px);line-height:1.2;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance;color:var(--ink)}
h2{font-size:15.5px;line-height:1.3;margin:0 0 12px;font-weight:700;letter-spacing:-.005em}
h2 .small,h2 .mute{font-weight:500;font-family:'Inter',sans-serif}
h3{font-size:14.5px;margin:0 0 8px;font-weight:700}
p{margin:0 0 10px}
.mute{color:var(--mute)}.small{font-size:13px}.nowrap{white-space:nowrap}.right{text-align:right}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hide-sm{}

/* ============ app shell ============ */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:6px;overflow:auto;z-index:30}
.rbrand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;border:0;background:none;text-align:left}
.rbrand b{font:700 18px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;color:var(--ink)}
.rbrand small{display:block;font-size:11px;color:var(--mute);margin-top:3px}
.who{position:relative}
.whobtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-align:left}
.whobtn:hover{border-color:var(--line-2)}
.whobtn b{display:block;font-size:13.5px;line-height:1.25}
.whobtn span.small{display:block;color:var(--mute);font-size:12px;line-height:1.25}
.rolemenu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-2);padding:6px;z-index:60;max-height:70vh;overflow:auto}
.rolemenu .rmh{font-size:11.5px;color:var(--mute);font-weight:600;padding:8px 10px 4px}
.rolemenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-size:13.5px}
.rolemenu button:hover{background:var(--surface-2)}
.rolemenu button.on{background:var(--brand-50);color:var(--brand);font-weight:600}
.rdot{width:8px;height:8px;border-radius:50%;flex:none}
.navlabel{font-size:11.5px;font-weight:600;color:var(--faint);padding:14px 10px 4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;height:40px;padding:0 10px;border-radius:9px;border:0;background:none;text-align:left;font-size:14px;font-weight:500;color:var(--ink-2)}
.nav button svg{color:var(--faint)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--brand-50);color:var(--brand);font-weight:600}
.nav button.on svg{color:var(--brand)}
.rfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px}
.democard{border-radius:12px;padding:12px;background:linear-gradient(135deg,var(--brand) 0%,#123f7a 100%);color:#fff}
.democard b{display:block;font:700 14px 'Plus Jakarta Sans',sans-serif}
.democard p{font-size:12.5px;opacity:.85;margin:3px 0 10px}
.democard .btn{width:100%;background:var(--coral);border-color:var(--coral);color:#fff}
.devby{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:11.5px;color:var(--mute)}
.devby img{height:18px;width:auto}
.col{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:25;height:60px;display:flex;align-items:center;gap:10px;padding:0 max(2.2vw,16px);background:rgb(244 246 249/.86);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .mbrand,.top .mrole{display:none}
.hsp{flex:1}
.hsearch{position:relative;flex:0 1 460px}
.hsearch input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px 0 38px;background:var(--surface);font-size:14px}
.hsearch input:focus{border-color:var(--brand-600);outline:3px solid var(--brand-50)}
.hsearch>svg{position:absolute;left:12px;top:11px;color:var(--faint)}
.sres{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-2);max-height:380px;overflow:auto;z-index:60;padding:4px}
.sres button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:8px 10px;border:0;background:none;border-radius:8px}
.sres button:hover{background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:none;height:32px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--brand-50);color:var(--brand)}
.ibtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-2)}
.ibtn:hover{border-color:var(--line-2);color:var(--ink)}
.badge-n{position:absolute;top:-5px;right:-5px;background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}
.main{padding:28px max(2.2vw,16px) 64px;max-width:1400px;width:100%}
.foot{padding:14px max(2.2vw,16px);border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.foot img{height:18px;width:auto;vertical-align:middle}
.demo-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--warn-50);color:var(--warn);border:1px solid var(--warn-200)}

/* ============ page header ============ */
.phead{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.phead p{margin:6px 0 0;color:var(--mute);max-width:72ch}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--mute);margin-bottom:6px;font-weight:500}

/* ============ surfaces ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}
/* KPI: grouped into one summary strip */
.grid:has(> .kpi){gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grid:has(> .kpi)>.kpi{border:0;border-radius:0;border-left:1px solid var(--line);margin:0}
.grid:has(> .kpi)>.kpi:first-child{border-left:0}
.kpi{padding:18px 20px;text-align:left;width:100%;background:var(--surface);display:block;font:inherit;color:inherit}
.kpi[onclick]{cursor:pointer}.kpi[onclick]:hover{background:var(--surface-2)}
.kpi .l{font-size:13px;color:var(--mute);font-weight:500}
.kpi .v{font-size:clamp(24px,2.3vw,30px);font-weight:700;line-height:1.15;margin:6px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.kpi .s{font-size:12.5px;color:var(--mute)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink-2);box-shadow:var(--sh-1);white-space:nowrap}
.btn:hover{background:var(--surface-2);color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-600)}
.btn.acc{background:var(--coral);border-color:var(--coral);color:#fff}.btn.acc:hover{filter:brightness(.96)}
.btn.sup{background:var(--brand-50);border-color:var(--brand-100);color:var(--brand);box-shadow:none}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--surface);border-color:var(--bad-200);color:var(--bad)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* pills & grades */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.ok{background:var(--ok-50);color:var(--ok);border-color:var(--ok-200)}.pill.warn{background:var(--warn-50);color:var(--warn);border-color:var(--warn-200)}.pill.bad{background:var(--bad-50);color:var(--bad);border-color:var(--bad-200)}.pill.pri,.pill.sup{background:var(--brand-50);color:var(--brand);border-color:var(--brand-100)}
.gr{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;font-weight:700;font-size:12px;flex:none}
.gr.A{background:var(--ok);color:#fff}.gr.B{background:var(--brand-600);color:#fff}.gr.C{background:var(--warn-50);color:var(--warn);border:1px solid var(--warn-200)}.gr.D{background:var(--bad-50);color:var(--bad);border:1px solid var(--bad-200)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--mute);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
thead th:first-child{border-top-left-radius:8px}thead th:last-child{border-top-right-radius:8px}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.scroll{overflow-x:auto}
/* explainable number: quiet affordance */
.xv{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;font-variant-numeric:tabular-nums;border-radius:6px}
.xv svg{color:var(--faint);flex:none;transition:color .15s}
.xv:hover{color:var(--brand-600)}.xv:hover svg{color:var(--brand-600)}
.bar{height:8px;background:#eef1f5;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--brand-600)}
/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea,.inp{min-height:42px;border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;background:var(--surface);font-size:15px;width:100%;box-shadow:var(--sh-1)}
.field input:focus,.field select:focus,.inp:focus{outline:3px solid var(--brand-50);border-color:var(--brand-600)}
.inp.sm{min-height:36px;font-size:14px;padding:4px 10px}
.err{color:var(--bad);font-size:13px;font-weight:600}
.note{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;display:flex;gap:10px;align-items:flex-start;color:var(--ink-2)}
.note>svg{flex:none;margin-top:1px}
.note.warn{background:var(--warn-50);border-color:var(--warn-200)}.note.warn>svg{color:var(--warn)}
.note.bad{background:var(--bad-50);border-color:var(--bad-200)}.note.bad>svg{color:var(--bad)}
.note.ok{background:var(--ok-50);border-color:var(--ok-200)}.note.ok>svg{color:var(--ok)}
.note.sup{background:var(--brand-50);border-color:var(--brand-100)}.note.sup>svg{color:var(--brand)}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;padding:4px;background:#eceff4;border-radius:12px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:0 14px;font-weight:600;border-radius:9px;white-space:nowrap;min-height:36px;font-size:13.5px;color:var(--mute)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;color:#fff}
.av.lg{width:68px;height:68px;font-size:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack-sm>*+*{margin-top:10px}

/* ============ planning board: a line of stations ============ */
.thread{position:relative;height:2px;background:var(--line-2);margin:18px 0 22px}
.thread::after{content:'';position:absolute;left:0;top:-1px;height:4px;width:100%;background:repeating-linear-gradient(90deg,var(--coral) 0 10px,transparent 10px 18px);opacity:.55;border-radius:2px}
.boardwrap{overflow-x:auto;padding:14px 2px 8px;margin:-10px -2px 0}
.board{display:grid;grid-template-columns:repeat(var(--n,6),minmax(168px,1fr));gap:18px}
.board .station:not(:last-child)::after{content:'';position:absolute;right:-17px;top:34px;width:16px;height:2px;background:var(--coral);opacity:.6}
.board{gap:14px;grid-template-columns:repeat(var(--n,6),minmax(158px,1fr))}
.board .station:not(:last-child)::after{right:-14px;width:13px}
.board .wk .av{display:none}
.wkb{flex:1;min-width:0}
.wkb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkm{display:flex;align-items:center;gap:6px;margin-top:2px}
.wkm .sub{flex:1}
.wkm .ef{margin-left:0!important;font-size:13px!important}
.wkm .gr{width:20px;height:20px;font-size:11px;border-radius:6px}
.xp{display:inline-flex;align-items:center;gap:3px;margin-top:4px;font-size:11px;font-weight:600;color:var(--coral);background:var(--coral-50);border-radius:6px;padding:1px 6px}
.capv{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px;font-weight:600;margin-bottom:5px;flex-wrap:wrap}
.bpill{position:absolute;top:-11px;right:10px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#fff;background:var(--bad);border-radius:20px;padding:2px 9px;box-shadow:var(--sh-1)}
.station{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;min-height:200px;display:flex;flex-direction:column;gap:9px;position:relative}
.station.bott{border-color:var(--bad-200);box-shadow:0 0 0 3px var(--bad-50);background:linear-gradient(var(--bad-50),var(--surface) 70px)}
.station.drop{border-color:var(--brand-600);border-style:dashed}
.station .sh{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.station .seq{font-size:11.5px;font-weight:600;color:var(--faint)}
.station h4{margin:2px 0 0;font:700 15px 'Plus Jakarta Sans',sans-serif}
.wk{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:grab;user-select:none;min-height:50px;transition:border-color .15s,box-shadow .15s}
.wk:hover{border-color:var(--line-2);box-shadow:var(--sh-1)}
.wk.sel{border-color:var(--brand-600);box-shadow:0 0 0 3px var(--brand-100)}
.wk .av{width:30px;height:30px;font-size:11px}
.wk .nm{font-size:13.5px;font-weight:600;line-height:1.2}
.wk .sub{font-size:12px;color:var(--mute)}
.wk .ef{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ba .side{padding:18px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.ba .side.after{background:var(--ok-50);border-color:var(--ok-200)}
.ba .big{font-size:clamp(32px,4vw,46px);font-weight:800;line-height:1;letter-spacing:-.03em}
/* heat */
.heat{border-collapse:separate;border-spacing:3px}
.heat td{text-align:center;font-weight:700;font-size:12.5px;padding:8px 4px;border:0;border-radius:6px}
.heat th{background:none;border:0;padding:6px}
.mx td{text-align:center;padding:6px 4px}.mx td:first-child,.mx th:first-child{text-align:left}.mx th.rot{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:12px;padding:8px 2px}
/* gantt */
.grow{display:grid;grid-template-columns:130px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--line);min-height:44px}
.gtrack{position:relative;height:44px}
.gbar{position:absolute;top:9px;height:26px;border-radius:7px;font-size:11.5px;font-weight:600;color:#fff;padding:0 8px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--coral)}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgb(16 24 40/.36);backdrop-filter:blur(2px);z-index:80}
.drawer{position:fixed;top:8px;right:8px;bottom:8px;width:min(460px,calc(100vw - 16px));background:var(--surface);z-index:81;box-shadow:var(--sh-2);display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--line)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dh h2{margin:0}
.drawer .db{padding:18px;overflow:auto;flex:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,94vw);max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px;z-index:81;padding:22px;box-shadow:var(--sh-2);border:1px solid var(--line)}
.formula{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;background:var(--surface-2);border:1px solid var(--line);padding:10px 12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.ntf{padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface)}
.ntf.unread{border-color:var(--brand-100);background:var(--brand-50)}
/* misc */
.keypad{display:grid;grid-template-columns:repeat(3,62px);gap:8px}
.keypad button{height:54px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:21px;font-weight:700;box-shadow:var(--sh-1)}
.keypad button:active{background:var(--brand-50)}
.entry input{width:60px;min-height:42px;text-align:center;font-size:16px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface)}
.entry input:focus{outline:3px solid var(--brand-50);border-color:var(--brand-600)}
.entry input.flag{border-color:var(--bad);background:var(--bad-50);color:var(--bad);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.step-dots{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.step-dots span{height:5px;flex:1;min-width:18px;border-radius:3px;background:var(--line)}
.step-dots span.on{background:var(--brand)}
.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.choice button{min-height:60px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;font-size:15px;color:var(--ink-2)}
.choice button:hover{border-color:var(--line-2)}
.choice button.on{border-color:var(--brand);background:var(--brand-50);color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.tl{position:relative;height:26px;background:var(--surface-2);border-radius:6px;border:1px solid var(--line)}
.tl i{position:absolute;top:3px;height:18px;border-radius:5px;opacity:.9}
.phone{max-width:390px;margin:0 auto;border:10px solid #1d2939;border-radius:36px;padding:16px 12px;background:var(--bg);box-shadow:var(--sh-2)}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--surface)}
.login .art{padding:clamp(28px,4.5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:28px;background:radial-gradient(1200px 500px at -10% 110%,var(--brand-50),transparent 60%),var(--surface)}
.login .art h1{font-size:clamp(34px,4.4vw,56px);line-height:1.04;letter-spacing:-.035em;font-weight:800;color:var(--ink)}
.login .art .hl{color:var(--coral)}
.login .pick{background:var(--bg);padding:clamp(24px,4vw,56px);overflow:auto;border-left:1px solid var(--line)}
.rgroup{font-size:12px;font-weight:600;color:var(--mute);margin:18px 0 8px}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.rcard{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:64px;box-shadow:var(--sh-1)}
.rcard:hover{border-color:var(--brand-100);box-shadow:0 0 0 3px var(--brand-50)}
.rcard .ricon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.rcard b{display:block;font-size:14px}
.minline{display:flex;gap:8px;align-items:flex-end;height:150px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1)}
.minline .st{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;height:100%}
.minline .st i{display:block;border-radius:6px;background:var(--brand-100);transition:height .8s cubic-bezier(.2,.8,.2,1)}
.minline .st.b i{background:var(--bad)}
.minline .st span{font-size:10.5px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* how it works */
.flow{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:4px}
.fstep{flex:1 0 152px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative}
.fnum{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;font:700 13px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.farrow{display:flex;align-items:center;color:var(--faint);flex:none}
.rcg{display:flex;flex-direction:column}.rcg .row:last-child{margin-top:auto}.rcg .btn{flex:1}
.welcome{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:22px;position:relative;overflow:hidden}
.welcome::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--coral)}
.wsteps{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 8px;font-size:13px;counter-reset:w}
.wsteps li{counter-increment:w;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 4px}
.wsteps li::before{content:counter(w);width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* guided tour */
.spot{position:fixed;z-index:90;border-radius:14px;box-shadow:0 0 0 9999px rgb(16 24 40/.55);pointer-events:none;transition:all .25s ease;outline:2px solid var(--coral);outline-offset:2px}
.tdim{position:fixed;inset:0;background:rgb(16 24 40/.55);backdrop-filter:blur(2px);z-index:89}
.tour{position:fixed;z-index:91;width:min(440px,calc(100vw - 24px));background:var(--surface);border-radius:18px;padding:18px 20px;box-shadow:var(--sh-2),0 0 0 1px rgb(16 24 40/.06);font-size:14.5px;max-height:calc(100vh - 24px);overflow:auto}
.tour.center{width:min(660px,calc(100vw - 24px));padding:28px}
.tour.center h3{font-size:28px;letter-spacing:-.02em}
.tour.present{font-size:16px;width:min(480px,calc(100vw - 24px))}
.tour.present.center{width:min(720px,calc(100vw - 24px))}
.tour.wide{width:min(980px,calc(100vw - 32px))}.tour.wide .tbody{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}.tour.wide .tnotes{margin-top:12px}
.tour .stp{font-size:12px;font-weight:600;color:var(--coral)}
.tour h3{font:700 20px/1.25 'Plus Jakarta Sans',sans-serif;margin:12px 0 6px;color:var(--ink);letter-spacing:-.01em}
.tour .tw{margin:0 0 12px;color:var(--ink-2)}
.tbar{display:flex;gap:6px;margin-top:12px}.tseg{flex:1;display:flex;gap:2px}.tseg i{flex:1;height:4px;border-radius:3px;background:var(--line)}.tseg i.done{background:var(--brand)}.tseg i.cur{background:var(--coral)}
.ty,.ttry,.tsay{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:.93em;border:1px solid var(--line)}
.ty{background:var(--brand-50);border-color:var(--brand-100)}.ty svg{color:var(--brand)}
.ttry{background:var(--ok-50);border-color:var(--ok-200)}.ttry svg{color:var(--ok)}
.ty svg,.ttry svg{flex:none;margin-top:3px}
.tsay{display:block;background:var(--warn-50);border-color:var(--warn-200);font-style:italic}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tchips span{background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12.5px}.tchips b{color:var(--coral);margin-right:3px}
.ibtn.tsm{height:30px;min-width:30px;padding:0 6px;border-radius:8px}
.tagenda{margin-top:12px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px}
.tagenda .tch{font-size:11.5px;font-weight:700;color:var(--coral);padding:8px 8px 2px}
.tagenda button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;font-size:13px}
.tagenda button:hover{background:var(--surface-2)}.tagenda button.on{background:var(--brand-50);font-weight:600}
/* responsive */
@media(max-width:1180px){.g4,.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.app{grid-template-columns:224px minmax(0,1fr)}}
@media(max-width:980px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid:has(> .kpi)>.kpi{border-top:1px solid var(--line)}}

 .app{grid-template-columns:minmax(0,1fr)}
 .rail{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgb(16 24 40/.06)}
 .rail>:not(.nav){display:none}.navlabel{display:none}
 .nav{flex-direction:row;overflow-x:auto;gap:2px;width:100%}
 .nav button{flex:1 0 auto;flex-direction:column;height:56px;gap:3px;font-size:10.5px;padding:4px 8px;justify-content:center}
 .top .mrole{display:inline-flex}
 .top .mbrand{display:flex;align-items:center;gap:8px;font:700 16px 'Plus Jakarta Sans',sans-serif;border:0;background:none}
 .hsearch{flex:1 1 auto}.top .seg{display:none}
 .main{padding-bottom:96px}.foot{padding-bottom:84px}
 .login{grid-template-columns:minmax(0,1fr)}.login .pick{border-left:0}}
@media(max-width:600px){.g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}.ba{grid-template-columns:minmax(0,1fr)}.board{grid-template-columns:minmax(0,1fr)}.board .station::after{display:none}.hide-sm{display:none!important}
 .grid:has(> .kpi){grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid:has(> .kpi)>.kpi{border-left:0;border-top:1px solid var(--line);padding:14px}
 .grid:has(> .kpi)>.kpi:nth-child(even){border-left:1px solid var(--line)}
 .grid:has(> .kpi)>.kpi:nth-child(-n+2){border-top:0}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--mute);font-size:12px;white-space:normal}.stack td:empty{display:none}
 .top .ibtn.hide-xs{display:none}.main{padding-top:18px}}

/* ===================== v8 · modern thematic layer ===================== */
:root{--r:20px;--r-sm:12px;--sh-1:0 1px 2px rgb(16 24 40/.04),0 2px 6px -2px rgb(16 24 40/.06);--sh-card:0 1px 2px rgb(16 24 40/.04),0 4px 14px -6px rgb(16 24 40/.08);--line:#e8ebf1;--grad:linear-gradient(135deg,#0b2d5b 0%,#1d4a8c 55%,#2f63b5 100%)}
body{background:radial-gradient(900px 420px at 92% -8%,rgb(241 94 91/.08),transparent 62%),radial-gradient(900px 520px at 18% -18%,rgb(11 45 91/.10),transparent 60%),#f3f5fa;background-attachment:fixed}
/* floating sidebar */
.app{grid-template-columns:276px minmax(0,1fr)}
.rail{margin:12px 0 12px 12px;top:12px;height:calc(100vh - 24px);border-radius:22px;border:1px solid rgb(16 24 40/.06);box-shadow:var(--sh-card);padding:18px 14px}
.whobtn{border-radius:14px;background:#f6f8fc;border-color:transparent}
.nav button{height:42px;border-radius:12px;font-weight:500}
.nav button.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px rgb(11 45 91/.6)}
.nav button.on svg{color:#fff}
.nav button.on::after{content:'';margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px rgb(241 94 91/.25)}
.democard{border-radius:16px;background:var(--grad);position:relative;overflow:hidden}
.democard::before{content:'';position:absolute;inset:7px;border:1.5px dashed rgb(255 255 255/.22);border-radius:11px;pointer-events:none}
.top{background:transparent;backdrop-filter:none;border-bottom:0;height:68px;padding-top:6px}
.top.scrolled{background:rgb(243 245 250/.82);backdrop-filter:saturate(1.5) blur(12px)}
.hsearch input{height:44px;border-radius:14px;border-color:transparent;box-shadow:var(--sh-card)}
.ibtn{height:44px;min-width:44px;border-radius:14px;border-color:transparent;box-shadow:var(--sh-card)}
.seg{border-radius:14px;border-color:transparent;box-shadow:var(--sh-card);padding:4px}
.seg button{border-radius:10px;height:34px}
.main{padding-top:14px}
.main.enter{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* surfaces */
.card{border-radius:var(--r);border-color:rgb(16 24 40/.06);box-shadow:var(--sh-card)}
.btn{border-radius:12px}
.btn.pri{background:linear-gradient(180deg,#17457f,#0b2d5b);border-color:#0b2d5b}
.btn.pri:hover,.btn.acc:hover{transform:translateY(-1px)}
.btn.glass{background:rgb(255 255 255/.12);border-color:rgb(255 255 255/.22);color:#fff;box-shadow:none}
.btn.glass:hover{background:rgb(255 255 255/.2);color:#fff}
th{background:transparent;border-bottom:1px solid var(--line);font-weight:600}
.tabs{background:#e9edf4;border-radius:14px}
.tabs button{border-radius:10px}
.note{border-radius:14px}
.drawer{border-radius:22px}.modal{border-radius:22px}
/* bento KPI cards */
.grid:has(> .kpi){gap:14px;background:transparent;border:0;overflow:visible;border-radius:0}
.grid:has(> .kpi)>.kpi{border:1px solid rgb(16 24 40/.06)!important;border-radius:var(--r)!important;box-shadow:var(--sh-card)}
.kpi{position:relative;padding:18px 18px 16px;transition:transform .15s,box-shadow .15s}
.kpi[onclick]:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgb(16 24 40/.22)}
.kic{display:inline-flex;width:36px;height:36px;border-radius:11px;align-items:center;justify-content:center;margin-bottom:12px}
.kic.b{background:var(--brand-50);color:var(--brand)}.kic.c{background:var(--coral-50);color:#d9433f}.kic.g{background:var(--ok-50);color:var(--ok)}.kic.a{background:var(--warn-50);color:var(--warn)}
.kpi .v{font-size:clamp(24px,2.2vw,30px)}
/* hero greeting */
.hero{position:relative;border-radius:24px;background:var(--grad);color:#fff;margin-bottom:22px;overflow:hidden;box-shadow:0 18px 40px -20px rgb(11 45 91/.55)}
.hero::before{content:'';position:absolute;inset:10px;border:1.5px dashed rgb(255 255 255/.18);border-radius:16px;pointer-events:none}
.hero::after{content:'';position:absolute;right:-60px;top:-80px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgb(241 94 91/.35),transparent 65%);pointer-events:none}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;padding:26px 28px;align-items:center}
.hero-k{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;opacity:.85}
.hero-t{color:#fff!important;font-size:clamp(20px,2.2vw,26px)!important;margin-top:6px!important}
.hero .wsteps li{background:rgb(255 255 255/.1);border-color:rgb(255 255 255/.18);color:#fff}
.hero .wsteps li::before{background:var(--coral)}
.hero-ai{background:rgb(255 255 255/.1);border:1px solid rgb(255 255 255/.18);border-radius:18px;padding:16px;backdrop-filter:blur(6px)}
.hero-ai b{display:block;font:700 16px/1.3 'Plus Jakarta Sans',sans-serif;margin:6px 0 4px}
.hero-ai p{font-size:13.5px;opacity:.88;margin:0 0 12px}
.hero-ai .btn:not(.glass){background:#fff;color:var(--brand);border-color:#fff}
/* AI */
.aifab{position:fixed;right:22px;bottom:22px;z-index:70;display:flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 8px;border:0;border-radius:26px;background:linear-gradient(135deg,#0b2d5b,#2d58ad 60%,#f15e5b);color:#fff;font:700 14.5px 'Plus Jakarta Sans',sans-serif;box-shadow:0 14px 30px -10px rgb(11 45 91/.6);transition:transform .15s}
.aifab:hover{transform:translateY(-2px)}
.aiorb{display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%,#fff3,transparent 60%),linear-gradient(135deg,#f15e5b,#ff9a76);color:#fff;flex:none;box-shadow:0 0 0 3px rgb(255 255 255/.18)}
.aiorb.sm{width:36px;height:36px}
.drawer.aid{width:min(480px,calc(100vw - 16px));overflow:hidden;padding:0}
.aih{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px;background:var(--grad);color:#fff}
.aih b{font:700 16px 'Plus Jakarta Sans',sans-serif}
.aistat{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgb(255 255 255/.14);white-space:nowrap}
.aistat.on{background:#12b76a;color:#fff}
.aibody{flex:1;overflow:auto;padding:14px 16px;background:#f7f9fc}
.ailabel{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;color:var(--mute);margin:12px 2px 8px}
.linkbtn{border:0;background:none;color:var(--brand-600);font-size:12px;font-weight:600}
.aiins{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:var(--sh-1)}
.aiins b{font-size:13.5px;display:block}
.aiins p{font-size:12.5px;color:var(--mute);margin:2px 0 0}
.aiic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--brand-50);color:var(--brand);flex:none}
.aiins.ok .aiic{background:var(--ok-50);color:var(--ok)}.aiins.bad .aiic{background:var(--bad-50);color:var(--bad)}.aiins.warn .aiic{background:var(--warn-50);color:var(--warn)}
.aimsg{max-width:92%;padding:10px 13px;border-radius:16px;margin-bottom:10px;font-size:13.8px;line-height:1.5}
.aimsg.u{margin-left:auto;background:var(--brand);color:#fff;border-bottom-right-radius:6px;width:fit-content}
.aimsg.a{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.aimsg p{margin:0 0 6px}.aimsg p:last-child{margin:0}.aimsg ul{margin:4px 0 8px;padding-left:18px}.aimsg li{margin-bottom:3px}
.ainote{font-size:11px;color:var(--faint);margin-top:6px}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.aisug{display:flex;flex-direction:column;gap:6px}
.aisug button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-size:13px;color:var(--ink-2)}
.aisug button svg{color:var(--coral);flex:none}
.aisug button:hover{border-color:var(--brand-100);background:var(--brand-50)}
.aiin{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:#fff}
.aiin input{flex:1;height:44px;border:1px solid var(--line-2);border-radius:12px;padding:0 12px;font-size:14px}
.aiin input:focus{outline:3px solid var(--brand-50);border-color:var(--brand-600)}
.aiin .btn{min-width:44px;padding:0}
.aifoot{font-size:11px;color:var(--faint);padding:0 16px 12px;background:#fff}
.askai{background:linear-gradient(135deg,#eef3fa,#fff1f0);border-color:#dde5f2;color:var(--brand)}
.askai svg{color:var(--coral)}
/* toast */
.toast{position:fixed;top:18px;right:22px;z-index:120;display:flex;align-items:center;gap:8px;background:#101828;color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--sh-2);opacity:0;transform:translateY(-8px);pointer-events:none;transition:all .2s;max-width:min(420px,90vw)}

 },

  const dhu=rs.reduce((a,r)=>a+r.dhu*r.hours,0)/h;
  const last=Math.min(...rs.map(r=>r.to));
  const best=Math.max(...rs.map(r=>r.eff));

  const gsmv=plan.ops.reduce((a,o)=>a+o.smv,0);
  const eff=output*gsmv/(operators*60)*100;

  const product=recs.some(r=>r.product===order.product)?100:recs.some(r=>PRX[r.product]&&PRX[r.product].cat===cat)?50:0;
  const dhuV=a?a.dhu:(recs.length?recs.reduce((s,r)=>s+r.dhu,0)/recs.length:5);
  const quality=Math.max(0,100-dhuV*10);
  const recency=a?calc.recency(a.last):0;
  const machine=w.machines.includes(OPX[op].m)?100:0;
  const c=[['skill',skill],['buyer',buyer],['product',product],['quality',quality],['recency',recency],['machine',machine]].map(([k,v])=>({k,v,w:P.w[k],c:v*P.w[k]}));
  return {c,total:c.reduce((s,x)=>s+x.c,0),agg:a};
 },
 roleFit(D,m,vac){
  const W=D.params.rf;
  const exp=(m.buyers.includes(vac.buyer)?50:0)+(m.prods.includes(vac.product)?50:0);
  const chg=m.chg<=2?100:m.chg>=10?0:100*(10-m.chg)/8;
  const c=[['eff',Math.min(100,m.eff)],['exp',exp],['chg',chg],['qual',Math.max(0,100-m.dhu*10)],['team',Math.min(100,m.team/vac.teamSize*100)],['ten',Math.min(100,m.ten/5*100)]].map(([k,v])=>({k,v,w:W[k],c:v*W[k]}));
  return {c,total:c.reduce((s,x)=>s+x.c,0)};
 },
 forecast(D,weeks=12){
  const th=calc.gradeRank(D.params.threshold);
  const ops=[...new Set(D.orders.flatMap(o=>o.ops.map(x=>x.op)))];
  const avail={};
  ops.forEach(op=>{avail[op]=D.workers.filter(w=>w.status!=='Resigned'&&w.desig==='Operator').filter(w=>{const a=calc.agg(D,w.id,op);return a&&calc.gradeRank(a.grade)>=th;}).length;});
  const grid=ops.map(op=>({op,avail:avail[op],weeks:Array.from({length:weeks},(_,k)=>{
   const ws=dAdd(TODAY,k*7),we=dAdd(TODAY,k*7+6);
   const req=D.orders.filter(o=>['Running','Planned','Ready for Planning','Pending SMV Confirmation','Scheduled','Pending PM approval'].includes(o.status)&&new Date(o.start)<=we&&new Date(o.end||dAdd(new Date(o.start),35))>=ws).reduce((a,o)=>a+((o.ops.find(x=>x.op===op)||{req:0}).req),0);
   return {req,gap:Math.max(0,req-avail[op])};})}));
  return grid;
 }
};

const V={};
/* ---------- shared planning helpers ---------- */
function effOf(wid,op){const a=calc.agg(D,wid,op);return a?a.eff:35;}
function bonusOf(wid,op,o){return D.records.some(r=>r.wid===wid&&r.op===op&&r.validated&&r.buyer===o.buyer&&r.product===o.product)?D.params.expBonus:0;}
function lineFree(lineId,exceptId){const ends=D.orders.filter(o=>o.line===lineId&&o.id!==exceptId&&['Running','Scheduled','Planned','Pending PM approval'].includes(o.status)).map(o=>new Date(o.end));return ends.length?calc.workDate(dAdd(new Date(Math.max(...ends)),1),1):calc.workDate(dAdd(TODAY,1),1);}
function recommendLine(o){
 const lines=D.lines.map(l=>{const ws=D.workers.filter(w=>w.line===l.id&&w.desig==='Operator');const exp=ws.filter(w=>D.records.some(r=>r.wid===w.id&&r.buyer===o.buyer&&r.product===o.product)).length;return {l,n:ws.length,exp,free:lineFree(l.id,o.id)};});
 lines.sort((a,b)=>(b.exp*2+b.n)-(a.exp*2+a.n)||a.free-b.free);return lines[0];
}
function getPlan(oid){
 if(D.plans[oid])return D.plans[oid];
 const o=O(oid);const line=o.line||recommendLine(o).l.id;
 const ops=o.ops.map(x=>({...x}));const assign={};
 if(line===DEMO_LINE_ID&&o.product==='POLO'){DEMO_CREW.forEach(c=>assign[c[0]]=c[4]);}
 else{/* memory layout: each operator where the Line Chief usually puts them (primary station), gaps filled with whoever is free */
  const pool=D.workers.filter(w=>w.line===line&&w.desig==='Operator'&&w.status==='Active');const used=new Set();const cnt={};
  pool.forEach(w=>{const x=ops.find(o=>o.op===w.primary);if(x&&(cnt[x.op]||0)<x.req){assign[w.id]=x.op;cnt[x.op]=(cnt[x.op]||0)+1;used.add(w.id);}});
  ops.forEach(x=>{while((cnt[x.op]||0)<x.req){const w=pool.filter(w=>!used.has(w.id)).sort((a,b)=>effOf(b.id,x.op)-effOf(a.id,x.op))[0];if(!w)break;assign[w.id]=x.op;used.add(w.id);cnt[x.op]=(cnt[x.op]||0)+1;}});}
 /* still short? borrow the best available operators from the same floor, then the same unit */
 const borrowed=[];const ln=L(line);const busy=new Set(Object.values(D.plans).flatMap(q=>Object.keys(q.assign)));
 ops.forEach(x=>{let n=Object.values(assign).filter(v=>v===x.op).length;if(n>=x.req)return;
  const cands=D.workers.filter(w=>w.status==='Active'&&w.desig==='Operator'&&!(w.id in assign)&&!busy.has(w.id)&&w.unit===ln.unit&&calc.agg(D,w.id,x.op)).sort((a,b)=>(b.floor===ln.floor)-(a.floor===ln.floor)||effOf(b.id,x.op)-effOf(a.id,x.op));
  for(const w of cands){if(n>=x.req)break;assign[w.id]=x.op;borrowed.push(w.id);n++;}});
 const bench=D.workers.filter(w=>w.unit===L(line).unit&&w.floor===L(line).floor&&w.status==='Active'&&w.desig==='Operator'&&!(w.id in assign)&&(w.floater||(w.line===line))).slice(0,8).map(w=>w.id);
 D.plans[oid]={oid,line,ops,assign,memory:{...assign},borrowed,bench,log:[],balanced:false,hours:D.params.stdHours,effOverride:null,qty:o.qty,start:isoD(lineFree(line,oid))};
 return D.plans[oid];
}
function planEffFn(p,o,withBonus){return (w,op)=>effOf(w,op)+(withBonus?bonusOf(w,op,o):0);}
function planNumbers(p){
 const o=O(p.oid),P=D.params;
 const v=calc.lineState(D,p,planEffFn(p,o,false));
 const vb=calc.lineState(D,p,planEffFn(p,o,true));
 const planEff=p.effOverride??vb.eff;
 const outHr=planEff/100*vb.target;
 const curve=o.repeatOf?P.lcRepeat:P.lcNew;
 const sch=calc.schedule(p.qty,Math.max(outHr,0.01),p.hours,curve);
 const end=calc.workDate(new Date(p.start),sch.days);
 const rev=calc.revenue(p.qty,o.cmUSD,P.fx);const cost=calc.prodCost(p.qty,v.gsmv,planEff,P.cpm);
 const fixedDay=calc.fixedPerDay(P,v.operators);const pricePc=o.cmUSD*P.fx;const bep=calc.bepPcs(fixedDay*sch.days,pricePc,P.varCost);
 let cum=0,bepDay=null;for(const s of sch.series){cum+=s.out;if(cum>=bep){bepDay=s.day;break;}}
 return {v,vb,planEff,outHr,curve,sch,end,late:end>new Date(o.delivery),rev,cost,margin:calc.margin(rev,cost),fixedDay,pricePc,bep,bepDay};
}

function xGrade(w,op,a){return {title:`Grade — ${w.name}, ${opN(op)}`,words:'Grade comes from the worker’s hours-weighted validated efficiency and DHU on this operation.',formula:'Avg Efficiency = sum(Efficiency × Hours) ÷ sum(Hours)\nGrade A: efficiency ≥ 80% and DHU ≤ 2 · B: 65–79% · C: 50–64% · D: below 50%',inputs:a.recs.map(r=>[`${r.buyer} ${r.style} (${fmtD(dAgo(r.to))})`,pc(r.eff)+' × '+r.hours+' h',r.source]).concat([['Weighted DHU',f1(a.dhu),'Validated records']]),result:`${pc(a.eff)} → Grade ${a.grade}`,updated:fmtD(dAgo(a.last))};}
function xMatch(w,op,o,m){return {title:`Match score — ${w.name}, ${opN(op)}`,words:'A weighted blend of proven skill, same-buyer and same-product experience, quality, recency and machine competency. Age, gender and other personal attributes are never used.',formula:'Match = 0.35×Skill + 0.20×Buyer + 0.15×Product + 0.10×Quality + 0.10×Recency + 0.10×Machine (weights editable)',inputs:m.c.map(c=>[c.k,f1(c.v)+' × '+c.w.toFixed(2),'= '+f1(c.c)]),result:f1(m.total)+' / 100'};}

function savingsModel(){

 let before=66,after=85.2;
 if(p){before=calc.lineState(D,{...p,assign:p.memory},planEffFn(p,O(p.oid),false)).output;after=calc.lineState(D,{...p,assign:p.balanced?p.assign:calc.autoBalance(D,p,planEffFn(p,O(p.oid),false),[]).assign},planEffFn(p,O(p.oid),false)).output;}

 const v=D.vq.filter(x=>x.status==='Pending').length;if(v)d.push({who:'Industrial Engineer',what:`Validate ${v} outlier production entr${v>1?'ies':'y'}`,go:`A.go('validate')`});

function decisionsCard(){const d=decisions();return `<div class="card" style="margin-top:14px" id="decisions"><div class="row between"><h2 style="margin:0">${UI.lang==='bn'?'অপেক্ষমাণ সিদ্ধান্ত':'Decisions waiting'}</h2><span class="pill ${d.length?'warn':'ok'}">${d.length}</span></div><div style="margin-top:8px">${d.map(x=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><span><b>${esc(x.what)}</b><br><span class="small mute">${esc(x.who)}</span></span>${canView(x.go.includes('interchange')?'interchange':x.go.includes('library')?'library':x.go.includes('validate')?'validate':'board')?`<button class="btn sm" onclick="${x.go}">Open ${ic('arrow',14)}</button>`:''}</div>`).join('')||'<p class="mute small">Nothing waiting. Every request has been decided.</p>'}</div></div>`;}
function bottleneckFreq(){const R=mulberry32(77);const w={SH:5,SS:2,NJ:2,SJ:1.5,HJ:1,NL:1};const ks=Object.keys(w),tot=ks.reduce((a,k)=>a+w[k],0);const cnt={};ks.forEach(k=>cnt[k]=0);D.lineDaily.forEach(()=>{let x=R()*tot;for(const k of ks){x-=w[k];if(x<=0){cnt[k]++;break;}}});const n=D.lineDaily.length;return ks.map(k=>({op:k,n:cnt[k],p:cnt[k]/n*100})).sort((a,b)=>b.n-a.n);}
function lineChart(vals){const W=640,H=200,mn=Math.floor(Math.min(...vals)-3),mx=Math.ceil(Math.max(...vals)+3);const x=i=>30+i*(W-50)/(vals.length-1),y=v=>H-24-(v-mn)/(mx-mn)*(H-40);
 const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Factory efficiency trend from ${pc(vals[0])} to ${pc(vals[vals.length-1])}">
 ${[mn,Math.round((mn+mx)/2),mx].map(v=>`<line x1="30" x2="${W-20}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="0" y="${y(v)+4}" font-size="11" fill="var(--mute)">${v}%</text>`).join('')}
 <polygon points="${x(0)},${H-24} ${pts} ${x(vals.length-1)},${H-24}" fill="var(--pri2)"/>
 <polyline points="${pts}" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linejoin="round"/>
 ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?5:3}" fill="var(--pri)"/>`).join('')}
 <text x="${x(0)}" y="${H-6}" font-size="11" fill="var(--mute)">W−11</text><text x="${x(vals.length-1)}" y="${H-6}" font-size="11" fill="var(--mute)" text-anchor="end">This week</text></svg>`;}
function leagueTable(lastW){const s=[...lastW].sort((a,b)=>b.eff-a.eff);const pick=[...s.slice(0,5),...s.slice(-3)];return `<div class="stack-sm">${pick.map((x,i)=>`${i===5?'<div class="small mute" style="padding-top:6px">…lowest</div>':''}<div><div class="row between small"><b>${esc(L(x.line).name)}</b><span class="row">${status(x.eff)}<b class="num">${pc(x.eff)}</b></span></div><div class="bar"><i style="width:${x.eff}%;background:${x.eff>=65?'var(--ok)':x.eff>=57?'var(--warn)':'var(--bad)'}"></i></div></div>`).join('')}</div>`;}
function receiptCard(){
 const P=D.params,r=P.rcpt,useStudy=UI.tab.fx!=='cur',fx=useStudy?P.fxStudy:P.fx;const c=calc.receipt(r,fx,P.linesAdopted,P.workDaysMonth);
 const x={title:'Time-saving value receipt',words:'Seconds saved per minute on one line become hours gained per day, extra pieces, then money.',formula:'Seconds per Hour = Seconds Saved × 60\nSeconds per Day = Seconds per Hour × Hours\nHours Gained = Seconds per Day ÷ 3600 (rounded to 2 decimals)\nExtra Pieces = Hours Gained × Pieces per Hour (rounded)\nValue (BDT) = Extra Pieces × Price (USD) × Exchange Rate',inputs:[['Seconds saved per minute',r.secSaved],['Hours per day',r.hours],['Pieces per hour',r.pcsHr],['Price per piece (USD)',r.price],['Exchange rate',f2(fx),useStudy?'Concept study (2021)':'Current parameter']],result:bdt(c.bdt)+' per line per day'};

 <div class="grid g4" style="gap:8px;margin-bottom:10px">${[['secSaved','Seconds saved / min'],['pcsHr','Pcs / hour'],['price','Price USD'],['hours','Hours / day']].map(([k,l])=>`<label class="small"><span class="mute">${l}</span><input class="inp sm" type="number" step="any" value="${r[k]}" onchange="A.rcpt('${k}',this.value)"></label>`).join('')}</div>

function xBep(o,n){const P=D.params;return {title:'Break-even point',words:'Fixed line cost for the order period divided by what each piece contributes after variable cost.',formula:'Line Fixed Cost per Day = (Operators + Helpers + Line Staff) × Daily Wage + Line Overhead per Day\nBreak-Even (pcs) = Fixed Cost per Day × Order Days ÷ (Price per Piece − Variable Cost per Piece)\nBreak-Even Day = first day cumulative output ≥ Break-Even pcs',inputs:[['Operators / helpers / staff',n.v.operators+' / '+P.helpers+' / '+P.lineStaff],['Daily wage',bdt(P.dailyWage)],['Line overhead per day',bdt(P.lineOverhead)],['Order days',n.sch.days],['Price per piece',f2(n.pricePc)+' BDT'],['Variable cost per piece',f2(P.varCost)+' BDT']],steps:[`Fixed per day = ${bdt(n.fixedDay)}`,`BEP = ${bdt(n.fixedDay)} × ${n.sch.days} ÷ (${f2(n.pricePc)} − ${f2(P.varCost)}) = ${f0(n.bep)} pcs`],result:f0(n.bep)+' pcs, reached on day '+(n.bepDay||'—')};}

 if(z.step===6){const tp=TEMPLATES[o.template||o.product]||[];body=`<h2>${t('Operation bulletin')}</h2><p class="small mute">Pick a template or a similar past style. The IE confirms SMV after you submit.</p><div class="choice" style="margin-bottom:12px">${Object.keys(TEMPLATES).map(k=>`<button class="${(o.template||o.product)===k?'on':''}" onclick="UI.wiz.o.template='${k}';render()">${prN(k)}</button>`).join('')}</div>

 if(z.step===7){const lc=leadCheck(o),rp=repeatHint(o),dup=D.orders.some(x=>x.style===o.style);
  body=`<h2>${t('Review')}</h2><table class="stack"><tbody>${[[t('Buyer'),o.buyer],[t('Style'),o.style],[t('Product'),prN(o.product)],[t('Quantity'),f0(+o.qty||0)+' pcs'],['CM',o.price?'USD '+f2(o.priceUnit==='dz'?o.price/12:+o.price)+' per piece':''],[t('Delivery date'),fmtD(o.delivery)],[t('Operation bulletin'),prN(o.template||o.product)+' template']].map(([k,v])=>`<tr><td class="mute">${k}</td><td><b>${v||'<span class="err">Missing</span>'}</b></td></tr>`).join('')}</tbody></table>

function repeatHint(o){if(!o.style)return '';const base=o.style.replace(/\d+$/,'');const prev=D.records.filter(r=>r.style.startsWith(base)&&base.length>3&&r.style!==o.style);if(!prev.length)return '';const ws=new Set(prev.map(r=>r.wid));return `<div class="note sup" id="repeatdet">${ic('star')}<span><b>Repeat of ${esc(prev[0].buyer)} ${esc(prev[0].style)}</b> — ${ws.size} workers in the factory have done this style. Repeat orders ramp up faster (learning curve ${D.params.lcRepeat.join('% → ')}%).</span></div>`;}
function leadCheck(o){
 if(!o.delivery||!o.qty)return {ok:true,html:''};
 const tp=TEMPLATES[o.template||o.product]||TEMPLATES.POLO;const smv=tp.reduce((a,x)=>a+x[1],0),ops=tp.reduce((a,x)=>a+x[2],0);
 const outHr=ops*60/smv*0.65,days=Math.ceil(o.qty/(outHr*D.params.stdHours));const start=lineFree(DEMO_LINE_ID);const end=calc.workDate(start,days+3);
 const ok=new Date(o.delivery)>=end;
 const x={title:'Lead-time check',words:'Estimated sewing days at a typical 65% line efficiency, plus 3 days for planning and feeding, from the earliest free line.',formula:'Days = Order Qty ÷ (Operators × 60 ÷ Garment SMV × 0.65 × Hours per Day), then + 3 lead days, working days only (Friday off)',inputs:[['Order qty',f0(o.qty)],['Operators (template)',ops],['Garment SMV',f2(smv)],['Earliest line free',fmtD(start)]],result:'Earliest safe delivery '+fmtD(end)};
 return {ok,end,html:ok?`<div class="note ok">${ic('check')} Lead time OK — ${xv('earliest safe delivery '+fmtD(end),x)}.</div>`:`<div class="note warn" id="leadwarn">${ic('alert')}<span><b>Lead time too short.</b> ${xv('Earliest safe delivery is '+fmtD(end),x)}. <button class="btn sm" style="margin-top:6px" onclick="A.fixDelivery('${isoD(dAdd(end,3))}')">Use ${fmtD(dAdd(end,3))}</button></span></div>`};
}

function shortlist(o,F={}){
 const rec=recommendLine(o);const recLine=o.line||rec.l.id;
 return o.ops.map(x=>{
  let ws=D.workers.filter(w=>w.status==='Active'&&w.desig==='Operator');
  if(F.unit)ws=ws.filter(w=>w.unit===F.unit);
  if(F.buyer)ws=ws.filter(w=>D.records.some(r=>r.wid===w.id&&r.buyer===o.buyer));
  if(F.product)ws=ws.filter(w=>D.records.some(r=>r.wid===w.id&&r.product===o.product));
  const sc=ws.map(w=>{const m=calc.matchComponents(D,w,x.op,o);const ro=D.orders.find(q=>q.line===w.line&&q.status==='Running'&&w.line!==recLine);let disrupt='';if(ro&&m.agg){disrupt=`Moving drops ${L(w.line).name} by ~${f1(calc.workerCapHr((ro.ops.find(y=>y.op===x.op)||{smv:1.2}).smv,m.agg.eff))} pcs/hr`;}return {w,m,disrupt};}).filter(s=>s.m.agg&&s.m.c.find(c=>c.k==='machine').v>0).sort((a,b)=>b.m.total-a.m.total);
  const avail=sc.filter(s=>calc.gradeRank(s.m.agg.grade)>=calc.gradeRank(D.params.threshold)&&!s.disrupt).length;
  return {op:x.op,smv:x.smv,req:x.req,avail:Math.min(avail,99),top:sc.slice(0,5)};
 });
}

function beforeAfter(p,o,mem,st){
 const P=D.params,ef=planEffFn(p,o,true);
 const memB=calc.lineState(D,{...p,assign:p.memory},ef),aftB=calc.lineState(D,p,ef);
 const sch=e=>{const s=calc.schedule(p.qty,e/100*st.target,p.hours,o.repeatOf?P.lcRepeat:P.lcNew);return {days:s.days,end:calc.workDate(new Date(p.start),s.days)};};
 const s0=sch(memB.eff),s1=sch(aftB.eff);
 const c0=calc.prodCost(p.qty,st.gsmv,memB.eff,P.cpm),c1=calc.prodCost(p.qty,st.gsmv,aftB.eff,P.cpm);
 return `<div class="card" style="margin-top:14px;border-color:var(--ok)" id="beforeafter"><div class="row between"><h2 style="margin:0">${t('Before')} vs ${t('After')}</h2><span class="pill ok">${p.log.length} moves</span></div>
 <div class="ba" style="margin-top:12px"><div class="side"><div class="small mute">${t('Memory-based line')}</div><div class="big">${xv(pc(mem.eff),xLineEff(mem,'memory-based layout'))}</div><div class="small" style="margin-top:6px">${f1(mem.output)} pcs/hr · bottleneck ${opN(mem.bott)}<br>Planned ${pc(memB.eff)} → ${s0.days} days → ${fmtD(s0.end)}<br>Cost ${bdt(c0)}</div></div>
 <div class="side after"><div class="small" style="color:var(--ok);font-weight:700">${t('Skill-based line')}</div><div class="big" style="color:var(--ok)">${xv(pc(st.eff),xLineEff(st,'skill-based layout'))}</div><div class="small" style="margin-top:6px">${f1(st.output)} pcs/hr · bottleneck ${opN(st.bott)}<br>Planned ${pc(aftB.eff)} (with expert bonus) → ${s1.days} days → ${fmtD(s1.end)}<br>Cost ${bdt(c1)} · <b>saves ${xv(bdt(c0-c1),{title:'Cost saved by skill-based placement',words:'Production cost at the memory-based planned efficiency minus cost at the skill-based planned efficiency.',formula:'Saving = Cost(before) − Cost(after); Cost = Qty × SMV ÷ (Eff ÷ 100) × Cost per Minute',inputs:[['Planned eff. before / after',pc(memB.eff)+' / '+pc(aftB.eff)],['Qty',f0(p.qty)],['SMV',f2(st.gsmv)],['Cost per minute',f2(P.cpm)]],result:bdt(c0-c1)})}</b> · ${s0.days-s1.days} days sooner</div></div></div>
 <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700;min-height:36px">${t('Move log')} (${p.log.length})</summary><ol class="small" style="margin:8px 0 0;padding-left:20px">${p.log.map(m=>m.type==='swap'?`<li>Swapped <b>${esc(W(m.a).name)}</b> (${opN(m.opA)} → ${opN(m.opB)}) with <b>${esc(W(m.b).name)}</b> (${opN(m.opB)} → ${opN(m.opA)}): line output ${f1(m.before)} → ${f1(m.after)} pcs/hr</li>`:m.type==='manual'?`<li>Manual: ${esc(m.text)}</li>`:`<li>Floater <b>${esc(W(m.b).name)}</b> replaced <b>${esc(W(m.a).name)}</b> on ${opN(m.opA)}: ${f1(m.before)} → ${f1(m.after)} pcs/hr</li>`).join('')}</ol></details></div>`;
}

 const rc=calc.receipt({secSaved:10,pcsHr:100,price:3,hours:8},84.75,1,1);add('Time-saving receipt at study inputs','BDT 33,815.25','BDT '+f2(rc.bdt),Math.abs(rc.bdt-33815.25)<0.001);
 add('ROI formula','(150 − 100) ÷ 100 × 100 = 50%',pc((150-100)/100*100),true);
 add('BEP formula','1,00,000 ÷ (146.4 − 6) = 712.3 pcs',f1(calc.bepPcs(100000,146.4,6))+' pcs',Math.abs(calc.bepPcs(100000,146.4,6)-712.25)<0.1);
 const sch=calc.schedule(1000,100,8,[50,65,80,100]);add('Learning curve schedule','400+520+640 = 1,560 ≥ 1,000 → 3 days… day 2 cum 920',sch.days+' days',sch.days===3);

 const ws=Object.values(D.params.w).reduce((s,x)=>s+x,0),rs=Object.values(D.params.rf).reduce((s,x)=>s+x,0);add('Weights total 1.00','1.00 / 1.00',ws.toFixed(2)+' / '+rs.toFixed(2),Math.abs(ws-1)<1e-6&&Math.abs(rs-1)<1e-6);

 const absent=D.workers.filter(w=>w.status!=='Active').map(w=>w.id);const anyPlanAbsent=Object.values(D.plans).some(p=>Object.keys(p.assign).some(w=>absent.includes(w)));add('Absent workers never auto-assigned','none','',!anyPlanAbsent);T[T.length-1].act=anyPlanAbsent?'found':'none';
 add('Overtime cap blocks plans over 10 h','blocked above '+(D.params.stdHours+D.params.maxOT)+' h','Accept disabled when hours > cap',true);

 add('SMV mismatch blocks IE confirmation','Confirm disabled when |diff| > 0.01','Rule in Style library',true);

 add('Interchange not applied without AGM/DGM','Applied only after AGM step',D.interchange.filter(x=>x.status==='Applied'&&!x.agmBy).length+' violations',D.interchange.every(x=>x.status!=='Applied'||x.agmBy));
 const menusOk=Object.values(MENU).every(m=>m.length<=7);add('Each role sees ≤ 7 menu items','≤ 7',Math.max(...Object.values(MENU).map(m=>m.length))+' max',menusOk);

  bn:{t:'এইচআর: কর্মী তালিকা সঠিক রাখা',w:'এইচআর অফিসার বিদ্যমান এইচআর সিস্টেম থেকে সিঙ্ক করেন: ৩ জন নতুন, ৫ জন হালনাগাদ, ২টি দ্বন্দ্ব। আজকের হাজিরাও লোড হয়।',y:'বাকি সবকিছু এই তালিকার ওপর নির্ভর করে। অনুপস্থিত বা ছুটিতে থাকা কেউ পরিকল্পনায় আসে না।',tr:'পরবর্তী চাপলে সিঙ্ক ও হাজিরা লোড হবে।',s:'এইচআর কিছুই আবার টাইপ করেন না — তালিকা এইচআর সিস্টেম থেকে আসে, শুধু দুটি দ্বন্দ্ব মেটাতে হয়।'}}),

  bn:{t:'একজন কর্মীর প্রমাণিত দক্ষতা',w:'সালমা আক্তারের প্রোফাইল: তার করা প্রতিটি অপারেশন, গ্রেড, গড় দক্ষতা, ত্রুটি, ঘণ্টা ও শেষ কবে করেছেন।',y:'গ্রেড শুধু যাচাইকৃত রেকর্ড থেকে আসে — কেউ হাতে লেখে না। যেকোনো শতাংশে ক্লিক করলে কোন রেকর্ড থেকে এসেছে দেখা যায়।',tr:'সাইড সিমের পাশে ৭৮.০% চাপুন।',s:'ইনি সালমা। তিনি কীসে ভালো তা কাউকে জিজ্ঞেস করতে হয় না — রেকর্ডই বলে: সাইড সিম, গ্রেড বি, ৭৮%।'}}),

  bn:{t:'মার্চেন্ডাইজার: অর্ডার দেওয়া',w:'এমঅ্যান্ডএস পোলো রিপিট, স্টাইল 3174T-REPEAT02, ২৪,০০০ পিস — ধাপে ধাপে দেওয়া। দুটি চেক: রিপিট ডিটেক্টর আগের স্টাইল খুঁজে পায়, আর লিড-টাইম চেক জানায় ডেলিভারি খুব আগে।',y:'সমস্যা ফ্লোরে পৌঁছানোর আগেই ধরা পড়ে।',tr:'পরবর্তী চাপলে প্রস্তাবিত তারিখ নিয়ে জমা হবে।',s:'মার্চেন্ডাইজার অর্ডার একবারই দেন। সিস্টেম জানে আগের স্টাইল ১৮ জন সেলাই করেছেন — আর তারিখ যে খুব টাইট তাও জানায়।'}}),
